<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nordenbox · Real Fantasy</title>
  <meta name="description" content="Nordenbox — a narrative world of fictions, essays, podcasts and game projects." />
  <meta property="og:title" content="Nordenbox · Real Fantasy" />
  <meta property="og:description" content="A narrative world where we can build and modify." />
  <meta property="og:image" content="https://www.nordenbox.com/assets/nordenbox.jpg" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
      --font-serif: "Source Serif 4", Georgia, "Times New Roman",
        "STSong", "Songti SC", serif;
      --color-text: #222;
      --color-accent: #1f2a44;
      --color-bg: #cec5b2;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      background: var(--color-bg);
      color: var(--color-text);
      text-align: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--color-accent);
      margin: 0 0 1.2rem;
      line-height: 1.2;
    }

    .hero-img {
      width: 500px;
      max-width: 90%;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      margin-bottom: 1.8rem;
    }

    p {
      font-size: 1.15rem;
      margin: 0 0 2rem;
      color: var(--color-text);
    }

    a.enter-btn {
      display: inline-block;
      padding: 0.75rem 1.6rem;
      background: var(--color-accent);
      color: #f4efe4;
      text-decoration: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    a.enter-btn:hover {
      background: #2d3a5c;
    }
  </style>
</head>

<body>

  <h1>Nordenbox's Real Fantasy</h1>

  <img class="hero-img" src="assets/nordenbox.jpg" alt="Nordenbox Illustration">

  <p>A narrative world where we can build and modify.</p>

  <a class="enter-btn" href="home.html">Enter</a>
</body>

</html>
